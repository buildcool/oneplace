apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "io.github.buildcool.oneplace"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.buildcool.oneplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number so every APK installs as an update over the previous one.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Same key for every build → updates install without uninstalling.
    // CI writes the keystore from the SIGNING_KEYSTORE_BASE64 secret (see .github/workflows/android.yml).
    def keystorePath = System.getenv("SIGNING_KEYSTORE") ?: "${System.getProperty('user.home')}/.oneplace/release.p12"
    def keystoreFile = file(keystorePath)
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storeType "pkcs12"
                storePassword System.getenv("SIGNING_PASSWORD") ?: (file("${System.getProperty('user.home')}/.oneplace/password.txt").with { it.exists() ? it.text.trim() : "" })
                keyAlias "oneplace"
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // One APK per CPU type (smaller downloads) plus a universal one. The app's updater picks the right one.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    packaging {
        jniLibs {
            // Python, ffmpeg and QuickJS ship as lib*.so files that are executed, so they must be extracted on install.
            useLegacyPackaging = true
            // ONNX Runtime's engine (32 MB) is downloaded by the vocal remover on first use (edit/Ml.kt);
            // only its small JNI part stays in the APK.
            excludes.add('**/libonnxruntime.so')
        }
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def youtubedlAndroid = "0.18.1"
def media3 = "1.11.1"
def onnxRuntime = "1.31.1"

configurations {
    // The AAR itself, to fingerprint the engine library the app downloads later.
    ortAar { transitive = false }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    // In-app browser: early page scripts, page messages, private profiles (same version Capacitor uses).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    // yt-dlp + Python + QuickJS, ffmpeg and aria2c, all running on the phone (GPL-3.0).
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$youtubedlAndroid"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    // Built-in player: video, music in the background, lock-screen controls.
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Vocal remover (Spleeter on the phone).
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntime"
    ortAar "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntime@aar"
    testImplementation "com.microsoft.onnxruntime:onnxruntime:$onnxRuntime"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Full messages and printed lines from unit tests in the CI log (the vocal remover check prints its SNR).
tasks.withType(Test).configureEach {
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

// SHA-256 of libonnxruntime.so per CPU type, from the same AAR the app fetches it from (checked after download).
def ortHashes = {
    def out = []
    new java.util.zip.ZipFile(configurations.ortAar.singleFile).withCloseable { zip ->
        zip.entries().each { e ->
            def m = e.name =~ /^jni\/([^\/]+)\/libonnxruntime\.so$/
            if (m.matches()) {
                def md = java.security.MessageDigest.getInstance("SHA-256")
                zip.getInputStream(e).withCloseable { s ->
                    byte[] buf = new byte[65536]
                    int n
                    while ((n = s.read(buf)) > 0) md.update(buf, 0, n)
                }
                out << "${m.group(1)}=${md.digest().encodeHex()}"
            }
        }
    }
    out.sort().join(";")
}
android.defaultConfig.buildConfigField "String", "ORT_VERSION", "\"$onnxRuntime\""
android.defaultConfig.buildConfigField "String", "ORT_SO_SHA256", "\"${ortHashes()}\""
