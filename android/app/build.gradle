apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "io.github.buildcool.oneplace"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.buildcool.oneplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number so every APK installs as an update over the previous one.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Same key for every build → updates install without uninstalling.
    // CI writes the keystore from the SIGNING_KEYSTORE_BASE64 secret (see .github/workflows/android.yml).
    def keystorePath = System.getenv("SIGNING_KEYSTORE") ?: "${System.getProperty('user.home')}/.oneplace/release.p12"
    def keystoreFile = file(keystorePath)
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storeType "pkcs12"
                storePassword System.getenv("SIGNING_PASSWORD") ?: (file("${System.getProperty('user.home')}/.oneplace/password.txt").with { it.exists() ? it.text.trim() : "" })
                keyAlias "oneplace"
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // One APK per CPU type (smaller downloads) plus a universal one. The app's updater picks the right one.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    packaging {
        // Python, ffmpeg and QuickJS ship as lib*.so files that are executed, so they must be extracted on install.
        jniLibs { useLegacyPackaging = true }
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def youtubedlAndroid = "0.18.1"

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation project(':capacitor-android')
    // yt-dlp + Python + QuickJS, ffmpeg and aria2c, all running on the phone (GPL-3.0).
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$youtubedlAndroid"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
